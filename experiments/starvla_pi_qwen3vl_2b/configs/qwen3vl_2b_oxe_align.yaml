run_id: qwen3vl_2b_pi_v3_bridge_rt1_align
run_root_dir: ${oc.env:EXPERIMENT_ROOT}/artifacts/checkpoints
seed: 42
trackers: [jsonl]
wandb_entity: null
wandb_project: starvla_qwen3vl_2b_oxe
is_debug: false
version_id: "0.21"

framework:
  name: QwenPI_v3
  qwenvl:
    base_vlm: ${oc.env:MODEL_ROOT}
    attn_implementation: sdpa
    enable_gradient_checkpointing: false
  action_model:
    action_model_type: LayerwiseFM
    action_dim: 7
    state_dim: 7
    action_horizon: 16
    repeated_diffusion_steps: 8
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_inference_timesteps: 4
    diffusion_model_cfg:
      action_dit_hidden_dim: 1024
      output_dim: 1024
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: false
      norm_type: ada_norm
      positional_embeddings: null
      attention_head_dim: 64

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: ${oc.env:EXPERIMENT_ROOT}/data/oxe
    data_mix: bridge_rt_1
    lerobot_version: v2.0
    include_state: true
    action_mode: abs
    per_device_batch_size: 1
    obs_image_size: [224, 224]
    image_size: [224, 224]
    load_all_data_for_training: true
    video_backend: torchvision_av
    state_action_dtype: float16
    balance_dataset_weights: false
    balance_trajectory_weights: false
    filter_trajectories_to_cached_steps: true
    CoT_prompt: "Your task is {instruction}. To identify the key objects for your task. Locate their bounding boxes in [x1,y1,x2,y2] format."
    num_workers: 4
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 2

trainer:
  gradient_accumulation_steps: 16
  max_train_steps: 5000
  num_warmup_steps: 500
  save_interval: 1000
  eval_interval: 1000000
  learning_rate:
    base: 1.0e-04
    qwen_vl_interface: 0.0
    project_layers: 1.0e-04
    action_model: 0.0
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs: {min_lr: 5.0e-06}
  pretrained_checkpoint: ${oc.env:EXPERIMENT_ROOT}/artifacts/base/qwen3vl_2b_pi_v3_bridge_rt1_init/checkpoints/base_pytorch_model.pt
  freeze_modules: qwen_vl_interface,action_model
  repeated_diffusion_steps: 8
  gradient_clipping: 1.0
  logging_frequency: 10
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
  save_format: pt
